name: Measured MySQL Lab
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  real-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python lab.py doctor
      - name: Clean volume experiment
        run: |
          python lab.py start
          python lab.py run --output .local/ci-clean/run.json
          python lab.py oncall --output .local/ci-clean/oncall.json
          python lab.py stop
          python lab.py start
          python lab.py run --output .local/ci-repeat/run.json
          python lab.py oncall --output .local/ci-repeat/oncall.json
          python scripts/validate.py .local/ci-clean/run.json .local/ci-repeat/run.json
          python scripts/validate_oncall.py .local/ci-clean/oncall.json .local/ci-repeat/oncall.json
      - name: Verify public baselines and export
        run: |
          python scripts/audit_public.py
          python -m unittest discover -s tests -v
          python scripts/build_site.py
          python scripts/check_site.py
      - name: Retain sanitized execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-mysql-results
          path: |
            .local/ci-clean/run.json
            .local/ci-repeat/run.json
            .local/ci-clean/oncall.json
            .local/ci-repeat/oncall.json
      - name: Remove only CI Lab resources
        if: always()
        run: python lab.py destroy --confirm lynn-mysql-lab
