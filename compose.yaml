services:
  mysql:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    command:
      - --innodb-buffer-pool-size=134217728
      - --performance-schema=ON
      - --innodb-deadlock-detect=ON
      - --mysqlx=OFF
    environment:
      MYSQL_DATABASE: mysql_lab
      MYSQL_USER: lab_runner
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run python lab.py start first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python lab.py start first}
    ports:
      - "127.0.0.1:${LAB_PORT:-13316}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-lab.sql:ro
    cpus: 2
    mem_limit: 1g
    pids_limit: 256
    restart: "no"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 3s
      timeout: 2s
      retries: 50
      start_period: 15s
volumes:
  mysql-data:
